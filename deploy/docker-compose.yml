# MallX 开发环境 PostgreSQL（Docker Compose）
# 启动：docker compose up -d
# 停止：docker compose down
# 清空数据重建：docker compose down -v
#
# 注意：宿主机 5432 若已被本机自装 PostgreSQL 占用，请把下面 ports 改为 "5433:5432"，
#       并同步修改后端环境变量 DB_PORT（或 application.yml 默认值）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: mallx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mallx
      POSTGRES_USER: mallx
      POSTGRES_PASSWORD: mallx123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - mallx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mallx -d mallx"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mallx_pgdata:
