# MallX 开发环境 PostgreSQL（Docker Compose）
# 启动：docker compose up -d
# 停止：docker compose down
# 清空数据重建：docker compose down -v
#
# 端口说明：
#  - 宿主 5432 已被本机自装 PostgreSQL 占用；
#  - 宿主 5433 在 Docker Desktop 层被"幽灵"转发占用（bind 冲突，勿用）；
#  - 故统一映射到宿主 5434 -> 容器 5432。
# 后端连接串默认 DB_PORT=5434（见 mall-server application.yml），两端保持一致。
#
# 初始化挂载（Day 26 加入，CI 与本地共用同一拓扑）：
#  - 全新数据卷会按 backend/sql 的 01→14 顺序自动执行（与 deploy/docker-compose.app.yml 一致）；
#  - ★ 语义见 docs/daily/Day-25：initdb 以 ON_ERROR_STOP=1 熔断 —— 任一文件报错即中止，
#    其后补丁全部静默跳过；对全新库初始化是否成功，用
#    `SELECT count(*) FROM permissions` = 41 来判（容器 healthy ≠ 业务可用）；
#  - 已有数据的旧卷不受影响（initdb 只在数据目录为空时执行）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: mallx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mallx
      POSTGRES_USER: mallx
      POSTGRES_PASSWORD: mallx123
      TZ: Asia/Shanghai
    ports:
      - "5434:5432"
    volumes:
      - mallx_pgdata:/var/lib/postgresql/data
      - ../backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mallx -d mallx"]
      interval: 5s
      timeout: 3s
      retries: 10

  # V1.1 · D37：缓存基建（mallx-redis）。
  #  - 纯缓存用途，开发环境不挂持久卷（重启丢缓存 = 天然的全量失效，反而省心）；
  #  - ★ 宿主端口用 6380 而不是 6379：本机已有一个带密码的 redis7 容器占着 6379
  #    （用户其它项目的），避开它 ⇒ 本地 compose up 与 CI 拓扑完全一致；
  #  - healthcheck 与 postgres 同款节奏。
  redis:
    image: redis:7-alpine
    container_name: mallx-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mallx_pgdata:
