# ==============================================================================
# MallX 全栈编排（PostgreSQL + mall-server）
# ------------------------------------------------------------------------------
# ★ 与同目录的 `docker-compose.yml`（只起一个开发用 PostgreSQL，宿主 5434）【二者选一】：
#     · 只想连数据库、应用在 IDEA/本地跑  → 用 docker-compose.yml
#     · 想一条命令起完整环境              → 用本文件
#   为了不和开发库打架，本文件用了独立的 compose project 名（见下 `name:`）。
#
# 用法（★ 工作目录必须是 deploy/，`.env` 就在它旁边）：
#     cd deploy
#     cp .env.example .env        # 然后改掉 JWT_SECRET / DB_PASSWORD
#     docker compose -f docker-compose.app.yml up -d --build
#     docker compose -f docker-compose.app.yml ps         # 等 app 变 healthy
#     curl http://127.0.0.1:8080/api/hello
#     docker compose -f docker-compose.app.yml down       # 停（加 -v 连数据卷一起删）
#
# ★★ 镜像里的 jar 是【宿主 mvn 打好的】—— compose 不会替你编译，见 deploy/Dockerfile 文件头。
# ==============================================================================
name: mallx-stack

services:
  postgres:
    image: postgres:16-alpine
    # ★ 不写 container_name：交给 compose 按 project 命名，避免与开发库 `mallx-postgres` 撞名
    environment:
      POSTGRES_DB: ${DB_NAME:-mallx}
      POSTGRES_USER: ${DB_USERNAME:-mallx}
      # `:?` = 没设就【拒绝启动】。故意不给默认值：默认密码就是最容易被带进生产的那个坑
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置（请检查 deploy/.env）}
    volumes:
      - mallx-pgdata:/var/lib/postgresql/data
      # 首次启动（数据卷为空）时按文件名字典序自动执行 01→14；
      # ★ 数据卷一旦存在，这里【不会】再跑 ⇒ 后续新增的 sql 补丁要手工应用，见 deploy/README.md
      - ../backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    # 数据库【不】对外发布端口：只有 app 需要它。要进去 psql 就 `docker compose exec postgres psql -U mallx`
    expose:
      - "5432"

  app:
    image: mallx-server:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ★ V1.4 · D42：默认走【生产 profile】—— 它是「部署形态」的那份配置：
      #   关键项（DB_* / JWT_SECRET）不给默认值，缺失即启动失败；并关掉 swagger-ui。
      #   本地想让容器像开发机一样跑，就 `SPRING_PROFILES_ACTIVE=dev docker compose ... up`。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # ★ 容器内的 DB 地址是【服务名】postgres，不是 localhost ——
      #   localhost 在容器里指容器自己（这是 compose 最常见的第一个坑）
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-mallx}
      DB_USERNAME: ${DB_USERNAME:-mallx}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置（请检查 deploy/.env）}
      # ★★ 必须覆盖：不换掉它，任何人都能用仓库里的开发密钥自己签一个管理员 token
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置（请检查 deploy/.env）}
      # 本文件只起 postgres + app ⇒ 下面两个地址连不上，走 D40/D41 的降级路径；
      # ★ 它们【不算进 health】（见 application.yml 的 management.health 段），
      #   所以「缓存/MQ 不可用」不会把容器判成 unhealthy。
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      # ★ V1.4：这里【刻意不写 JAVA_OPTS】—— JVM 参数的单一来源是【镜像的 ENV】
      #   （Dockerfile 里的容器感知参数）。
      #   ⚠️ 原来是 `JAVA_OPTS: ${JAVA_OPTS:-某默认值}`，配合 deploy/.env 里那行
      #      `JAVA_OPTS=-Xmx512m ...` ⇒ compose 永远会注入一个值，把镜像 ENV 整段盖掉
      #      （本机实测：容器里 /proc/1/cmdline 仍是旧的 -Xmx512m，镜像里那套白写了）。
      #      ← 这就是「同一件事有两处默认值」的典型后果：改了 A 处，B 处继续生效。
      #   .env 里若还留着 JAVA_OPTS，它现在**不再被本文件引用**（compose 不再插值它）。
      #   要覆盖：用 `docker run -e JAVA_OPTS=...`，或在这里显式加回一行。
    # ★ V1.4：给容器一个真实的内存上限 —— 没有上限时 MaxRAMPercentage 只能按宿主内存算，
    #   「容器感知」就成了摆设。384m 是「够跑 + 能证明 JVM 确实按限额算堆」的最小值
    #   （验证：容器内 PrintFlagsFinal 的 MaxHeapSize 应为 384m×75% = 288m，见 docs/daily/Day-42）。
    mem_limit: 384m
    ports:
      - "${APP_PORT:-8080}:8080"
    # 首次启动时 postgres 可能还在跑 initdb 初始化脚本；起早了先崩，restart 会把它拉回来
    restart: unless-stopped

volumes:
  mallx-pgdata:
