spring:
  application:
    name: mallx-server

  # PostgreSQL（默认值对应 deploy/docker-compose.yml 中的 mallx-postgres，宿主映射端口 5434）
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:mallx}
    username: ${DB_USERNAME:mallx}
    password: ${DB_PASSWORD:mallx123}

  # Redis（V1.1 · D37：默认值对应 compose 的 mallx-redis，宿主 6380 -> 容器 6379；
  # ★ 6380 是为了避开本机已占用的 6379（用户其它项目的 redis7），本地/CI 同一默认值）
  # ★ 连接是懒建立：Redis 挂了不影响应用启动，只会让走缓存的读路径报错（D40 做降级）
  # ★ timeout 2s（D41 实证）：不设的话 lettuce 默认 60s 命令超时 —— Redis 停机后
  #   降级路径要挂 60s 才回源（CI runner 上 30s 的 HTTP 超时先到 ⇒ 降级断言失败）。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2s
      connect-timeout: 2s

  # RabbitMQ（V1.1 · D41：默认值对应 compose 的 mallx-rabbitmq；懒连接，MQ 挂了不影响启动）
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}

mybatis-plus:
  configuration:
    # 数据库下划线字段 自动映射为 Java 驼峰属性
    map-underscore-to-camel-case: true
    # 调试用：把 MP 生成的每条 SQL 打到控制台。默认关（太吵），需要时再打开
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # XML 映射文件位置：classpath*:（带星号）才能扫到兄弟模块 jar 里的 XML
  mapper-locations: classpath*:mapper/**/*.xml

server:
  port: 8080

# Swagger 文档路径与开关
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mallx:
  jwt:
    # ★ 这个开发默认值只在【本地/测试】生效：生产走 `application-prod.yml`，
    #   那里是 `${JWT_SECRET}` 不带兜底 ⇒ 没设就启动失败（不会静默用这个密钥）。
    secret: ${JWT_SECRET:mallx-dev-secret-key-please-change-me-2026}
    expire-minutes: 120
  order:
    # D41：延迟关单消息的 TTL（毫秒）。与 OrderTimeoutTask 的 2 分钟扫描兜底对齐；
    # 验收时用 ORDER_CLOSE_DELAY_MS 环境变量压短（如 5000）来证明 MQ 路径快于扫描。
    close-delay-ms: ${ORDER_CLOSE_DELAY_MS:120000}

# ==============================================================================
# 可观测性（V1.4 · D42）
# ------------------------------------------------------------------------------
# ★ 只暴露 health / info 两个端点。metrics / env / configprops / heapdump 一律不暴露：
#   它们会把数据源地址、环境变量、内部类名交给匿名访问者 —— 在「白名单式放行」的
#   安全模型里，这类端点等于给攻击者送探测信息。要临时看细节就改这里 + 重启，
#   不要图省事写 `include: "*"`。
# ★ show-details: never ⇒ 匿名只能看到 UP/DOWN，看不到「哪个组件挂了、报了什么错」。
# ★ probes.enabled: true ⇒ 多出 /actuator/health/liveness 与 readiness，两者语义【不同】：
#     liveness  = 进程还活着吗    → 挂了就重启容器
#     readiness = 现在能接流量吗  → 依赖没就绪就摘掉（不重启）
#   容器里用的是 readiness，见 deploy/Dockerfile 的 HEALTHCHECK。
# ==============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # ★ 只把【硬依赖】算进健康判据：DB 连不上 = 服务真的干不了活 ⇒ DOWN。
    #   Redis / RabbitMQ 在 D40/D41 已做降级（缓存读回源；MQ 关单有 2 分钟扫描兜底），
    #   它们是【可选依赖】—— 算进 health 会把「服务其实可用」误报成 DOWN，
    #   于是编排层摘流量甚至重启容器，**把可控降级升级成不可用**。
    redis:
      enabled: false
    rabbit:
      enabled: false

info:
  app:
    name: ${spring.application.name}
    description: MallX 企业级电商后端（模块化单体）
