spring:
  application:
    name: mallx-server

  # PostgreSQL（默认值对应 deploy/docker-compose.yml 中的 mallx-postgres，宿主映射端口 5434）
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:mallx}
    username: ${DB_USERNAME:mallx}
    password: ${DB_PASSWORD:mallx123}

mybatis-plus:
  configuration:
    # 数据库下划线字段 自动映射为 Java 驼峰属性
    map-underscore-to-camel-case: true

server:
  port: 8080

# Swagger 文档路径与开关
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mallx:
  jwt:
    secret: ${JWT_SECR  ET:mallx-dev-secret-key-please-change-me-2026}
    expire-minutes: 120