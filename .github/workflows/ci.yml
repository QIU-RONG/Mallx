# MallX CI —— 与本机验收完全同构的单 job 流水线
#
# 设计原则（为什么长这样）：
#  1. 复用 deploy/docker-compose.yml（同一个容器名 mallx-postgres、同一个 5434、
#     同一套 initdb 01→14）—— 63 个验收脚本一行不改即可在 runner 上运行；
#     本地与 CI 的唯一差异：mvn 离线(-o) vs 在线、Windows docker 绝对路径 vs
#     PATH 里的 docker（用 MALLX_DOCKER=docker 覆盖，见 loadtest/_paths.py 与各脚本）。
#  2. 「等数据库就绪」必须用数据判据（permissions=46，Day 46 起），不能用 pg_isready /
#     容器 healthy —— initdb 以 ON_ERROR_STOP=1 熔断，healthy 时补丁可能还没跑完
#     （Day 25 事故判据，见 docs/daily/Day-25）。
#  3. 全部判定来自脚本退出码（所有纳管脚本失败即 exit 1），CI 不 grep 人类可读文本。
#  4. M1 回归按收集器协议执行：--baseline → 五个链路脚本 → 收集器（缺一不可，
#     收集器靠报告 mtime 戳验证「本轮重新生成」）。
#  5. 性能审计（day27–34 + day28 落地验收）全部自带临时库（自灌自删），只需 postgres 在跑 ——
#     排在起应用之前，应用挂了也不影响审计段的判定。day35 是计时类一次性取证
#     （本机 5 分钟、runner 上估 15–30 分钟 + 计时断言会抖），不挂 CI。
#  6. 前端（FE4 新增）单独成 job：它**不需要** postgres / redis / 应用，塞进 ci job 只会
#     白等 ~8 分钟基础设施；独立 job 与后端并行，~1 分钟出结论。
#     ★ 两件事必须做：① 用 `npm ci`（锁文件）而不是 `npm install`，否则 CI 装的依赖与
#     本地提交的 lockfile 无关，「本地过 CI 挂」不可复现；② **额外断言 dist/index.html 存在** ——
#     `vite build` 退出码为 0 也可能是空产物，只看退出码等于什么都没测。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      MALLX_DOCKER: docker        # 覆盖脚本里硬编码的 Windows docker 路径
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # D46-A（Day 46 事故收口）：权限总数【单一来源】护栏 —— 纯静态、秒级、不需要 DB/应用/Docker。
      #   事故回放：Day 46 新增 5 条退款权限，总数 41→46，而这份事实被硬编码钉在 5 处，
      #   改的时候只想起来一处 ⇒ 下面「Wait for initdb」那条数据判据还写着旧值，
      #   永远等不到新值 ⇒ 整条 pipeline 红，而红的位置离真因（SQL 里多了 5 行）有十万八千里。
      #   （★ 本段注释刻意不写「permissions=旧值」：护栏 B2 段把【文案里的数字】也当成一处
      #     声明点 —— 注释里留着旧数字，同样是对后来者的误导。）
      # ★ 本护栏**不硬编码 46**：真值从 backend/sql/*.sql 的 INSERT INTO permissions 推导出来，
      #   再逐处核对 ci.yml / day24 / day25-strict / day25-compose / day43-ps1 里的常量
      #   ⇒ 以后加权限只需改 SQL；其余忘了改会被【点名是哪一处】；冒出第 6 处也会被 C2 段自动抓出。
      #   控制组（4 组，本地 `python backend/loadtest/_d46a_ctrl.py`）：漏改一处红 1 条、
      #   未登记声明点红 1 条、SQL 加一条权限红 9 条、判据写成 >= 红 2 条 —— 零误伤。
      - name: Permission count guard (单一来源：SQL 推导 → 各处常量)
        working-directory: backend/loadtest
        run: |
          if ! python day47-perm-count-guard.py; then
            echo "::error::权限总数常量与 backend/sql 不一致，或出现了未登记的硬编码点 —— 报告尾部："
            tail -30 day47-perm-count-guard-report.txt || true
            exit 1
          fi

      # V1.4 后半段（远端托管）：生产编排静态护栏。
      #   ★ 同样是纯静态、秒级 —— 它拦的那几类事故（数据库发布端口 / 镜像用 latest /
      #     忘了 mem_limit / 部署脚本里 down -v）**没有一条**会在编译、测试或
      #     `docker compose up -d` 时报错，只会在上线后的某一天变成事故。
      #   控制组 4 组（本地 `python backend/loadtest/_d47_prod_ctrl.py`）全部命中、零误伤。
      - name: Prod compose guard (暴露面 / 版本可回答 / 部署脚本不删库)
        working-directory: backend/loadtest
        run: |
          if ! python day47-prod-compose-guard.py; then
            echo "::error::生产编排不合规范 —— 报告尾部："
            tail -30 day47-prod-compose-guard-report.txt || true
            exit 1
          fi

      # Day 49 视觉统一：主题一致性护栏。
      #   ★ 它拦的是「主色被钉在 5 处，改一处漏四处」这一类漂移：
      #     两个 theme.css 的 EP 色阶、两个 main.ts 的样式加载顺序、
      #     两个应用的品牌色/价格色是否一致、源码里残留的硬编码色值。
      #     这些错 eslint、vue-tsc、vite build【全都不报】—— 症状只是「页面看着不对劲」，
      #     与上面两处「同一份事实钉在多处」是同一类问题。
      #   ★ 最硬的一条按 Element Plus 的混色公式从主色【推导】六个色阶再比对，
      #     所以只手改 --el-color-primary 会当场现形（症状：按钮 hover 跳回蓝色）。
      #   控制组 6 组（本地 `python backend/loadtest/_d49_theme_ctrl.py`）全部命中、零误伤。
      - name: Theme guard (主色单一来源 / 色阶成套 / import 顺序 / 无残留硬编码)
        working-directory: backend/loadtest
        run: |
          if ! python day49-theme-guard.py; then
            echo "::error::主题变量漂移 —— 报告见上方输出"
            exit 1
          fi

      # ★ 不再 -DskipTests（Day 44）：此前项目 189 个源文件、0 个测试类，
      #   「测试」全靠 81 个需要起全套基础设施的 Python 端到端脚本 —— 它们能证「链路通」，
      #   证不了「单个方法对」。现在补上真正的单元测试，install 会跑 test 阶段 ⇒ 失败即构建失败。
      # ⚠️ 约束：能进 src/test 的必须是**不依赖 DB / Redis / MQ** 的测试
      #   （本步骤跑在起 postgres 之前）。需要基础设施的验证继续走下面的 Python 脚本。
      - name: Build + unit tests (mvn install, 在线 —— CI 没有本地离线仓库)
        working-directory: backend/mallx
        run: mvn -B -ntp install

      - name: Start PostgreSQL (dev topology + initdb 01-14)
        working-directory: deploy
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d

      # ⚠️ permissions 的期望值必须【跟着 backend/sql/ 里新增权限的文件一起改】：
      #    Day 46 新增 5 条退款权限（42–46）后，这里仍写 41 ⇒ 判据永远等不到 ⇒ 整条 pipeline 红。
      #    ★ 别写「>= 46」：那会让「只跑到 14 号文件、15–18 全熔断」这种半截初始化蒙混过关，
      #      而这条判据存在的全部意义就是抓熔断。精确值才是判据。
      - name: Wait for initdb (数据判据：permissions=46，而非 pg_isready)
        run: |
          n=0
          for i in $(seq 1 60); do
            n=$(docker exec mallx-postgres psql -U mallx -d mallx -tAc \
                "SELECT count(*) FROM permissions" 2>/dev/null || echo 0)
            n=$(echo "$n" | tr -d '[:space:]')
            if [ "$n" = "46" ]; then
              echo "initdb complete: permissions=$n"
              break
            fi
            echo "waiting for initdb... ($i) permissions=$n"
            sleep 3
          done
          if [ "$n" != "46" ]; then
            echo "::error::initdb 未完成（permissions=$n，期望 46）—— 01→18 有文件熔断"
            docker logs mallx-postgres 2>&1 | tail -60
            exit 1
          fi

      # Day 43（D43-B）：护栏自检 —— 用 AST 核对「满额护栏常量 vs 实际断言调用点数」。
      # 不需要 DB / 应用，秒级；放在最前面（它检的是脚本自己，连库都不用连）。
      # ★ 为什么非要有这一步：D43-B 的根因正是「常量脱节 + 脚本不进 CI ⇒ 没人发现」，
      #   结果 13 条断言全 [OK] 却判 FAIL（假红），而满额护栏的本意恰恰是防假绿。
      # ⚠️ 该自检只适用于【顺序执行】的脚本；检测到 chk( 落在循环体内会返回 2 并拒绝出结论
      #   （循环里一个调用点执行多次，静态数必然小于运行时数 —— 见脚本 docstring）。
      - name: Guard self-checks (满额护栏常量 vs 实际断言数，AST 静态核对)
        working-directory: backend/loadtest
        run: |
          python day41-rabbitmq-close-verify.py --selfcheck

      - name: SQL strict check (熔断语义 / 临时库 / 零痕迹)
        working-directory: backend/loadtest
        run: python day25-sql-strict-check.py

      # Day 27–34 + day28 落地验收的性能审计脚本：全部「临时库自灌自删」（CREATE DATABASE →
      # 灌补丁（多数 01→14；day27 / day28-search-index-verify 为 01→15，含搜索修复）+ 造数 →
      # EXPLAIN/DROP 实验 → DROP DATABASE），与 dev 库零耦合、不需要应用在跑、
      # 失败即 exit 1（sys.exit(main())）。放在起应用之前：不依赖 8080，挂了能更早报错。
      - name: "Perf audits (day27-34 + day28 verify —— EXPLAIN 基线 / 搜索改法 / 搜索修复验收 / Dashboard / DROP 实验 / 分页 / 券侧 / 购物车)"
        working-directory: backend/loadtest
        # 脚本的判定输出只写 report 文件（stdout 仅一行 report ->），
        # 失败时必须把 report cat 出来，否则 CI 日志看不出挂的是哪条断言。
        run: |
          for s in day27-explain-audit day28-search-rewrite-probe day28-search-index-verify \
                   day29-dashboard-explain-audit day31-index-drop-probe day32-pagination-index-probe \
                   day33-coupon-status-probe day34-cart-index-probe; do
            echo "::group::$s"
            if ! python "$s.py"; then
              echo "::error::$s failed, report:"
              cat "$s-report.txt" || true
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Start app (jar 由上一步 mvn install 产出)
        run: |
          nohup java -jar backend/mallx/mall-server/target/mall-server-0.0.1-SNAPSHOT.jar \
            --server.port=8080 > /tmp/app.log 2>&1 &
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/hello || true)
            if [ "$code" = "200" ]; then echo "app up after $((i*3))s"; break; fi
            sleep 3
          done
          if [ "$code" != "200" ]; then
            echo "::error::应用未在 180s 内就绪"
            tail -80 /tmp/app.log
            exit 1
          fi

      - name: Apply M1 fixture (intruder + address + 6 PAID orders —— 434/434 的隐藏前置，见脚本 docstring)
        working-directory: backend/loadtest
        run: python day26-m1-fixture.py

      # ================================================================================
      # Day 41（V1.1 · RabbitMQ 延迟关单）—— 补上 CI 里唯一还缺的【功能】面。
      #
      # ★★ 为什么这一步必须排在 M1 regression【之前】（首跑失败换来的一条规律）：
      #   延迟队列用的是 **per-message TTL**，而 RabbitMQ 的 TTL 停靠队列是
      #   **顺序投递**的 —— 只有队首消息过期后才会检查下一条。M1 的链路脚本（day14/15/16）
      #   在 8080 上下单时会发 TTL=120000 的消息进 `mallx.order.ttl`；它们一旦排在前面，
      #   后面 TTL=5000 的消息就得等满 120 秒 ⇒ day41 的「秒级关单」必然超时。
      #   首跑实测：M1 先跑 ⇒ day41 等到 46.2s 超时（11/13 FAIL）；本机单独跑则 13/13。
      #   排在 M1 之前时 TTL 队列还是空的（容器刚起）⇒ 队首就是自己的 5s 消息。
      #
      # ★ 为什么单起一个实例：这条验收要的是「秒级关单」，靠 ORDER_CLOSE_DELAY_MS=5000；
      #   而 M1 链路的写操作（下单→支付）必须用**默认 TTL**（120s）。两者不能共用一个实例。
      # ★ 为什么以前只有 --selfcheck：它要短 TTL + 全局环境变量，当时没接进来。而 D43-B
      #   恰好证明了「不进 CI 的脚本会悄悄烂掉」。现在把功能验收也接上。
      # ================================================================================
      - name: Day 41 rabbitmq close verify (短 TTL 实例 :8081，必须排在 M1 之前)
        run: |
          # 防御性清队：per-message TTL 队列是顺序投递的，队首若残留长 TTL 消息会把
          # 本次的 5s 消息堵在后面（见上面的注释）。容器刚起时它本来就是空的。
          docker exec mallx-rabbitmq rabbitmqctl purge_queue mallx.order.ttl || true
          ROOT="$PWD"
          ORDER_CLOSE_DELAY_MS=5000 nohup java -jar \
            "$ROOT/backend/mallx/mall-server/target/mall-server-0.0.1-SNAPSHOT.jar" \
            --server.port=8081 > /tmp/app-shortttl.log 2>&1 &
          code=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/api/hello || true)
            if [ "$code" = "200" ]; then echo "short-ttl app (8081) up after $((i*3))s"; break; fi
            sleep 3
          done
          if [ "$code" != "200" ]; then
            echo "::error::短 TTL 实例未在 120s 内就绪"
            tail -60 /tmp/app-shortttl.log || true
            exit 1
          fi
          cd backend/loadtest
          if ! MALLX_BASE=http://127.0.0.1:8081 python day41-rabbitmq-close-verify.py; then
            echo "::error::Day 41 失败 —— 报告尾部："
            tail -40 day41-rabbitmq-close-verify-report.txt || true
            echo "::group::短 TTL 实例日志"
            tail -30 /tmp/app-shortttl.log || true
            echo "::endgroup::"
            exit 1
          fi


      # ★ Day 43：名单 5 → 9 —— 补上 day17-c/d/e/f（订单取消 / 库存列表 / 库存调整 / 库存流水）。
      #   T2（Day 24）当时只把 a/b 补进名单，c/d/e/f 四条同样漏着 ⇒ 它只治了当场撞上的那半边。
      #   其中 c/e 是**写侧**（会改库），但两条都自带还原（净变化 0 + 高水位删流水），
      #   本机实测 (c) database back at baseline 仍为 YES。断言总数 245 → 434。
      - name: M1 regression (baseline -> 9 scripts -> collect, 434/434)
        working-directory: backend/loadtest
        run: |
          python day17-m1-regression.py --baseline
          python day14-e2e-walk.py
          python day15-ship-confirm.py
          python day16-review-e2e.py
          python day17-a-order-list-verify.py
          python day17-b-order-detail-verify.py
          python day17-c-order-cancel-verify.py
          python day17-d-inventory-list-verify.py
          python day17-e-inventory-adjust-verify.py
          python day17-f-inventory-log-verify.py
          python day17-m1-regression.py

      # ★ Day 43 续：补上两个【功能面完全无人覆盖】的脚本（用端点差集盘出来的）——
      #   · day19：C 端搜索（V1.2 的核心）。`/api/products/search` 此前**没有任何在 CI 的
      #     脚本打过** —— 也就是说搜索修了 29x 之后，功能回归里一直没人守着它。纯读零写入。
      #   · day22：管理端用户管理 + 仪表盘。`/api/admin/users*` 与 `/api/admin/dashboard/*`
      #     同样无人覆盖（67 条断言）。自带高水位清理 + 基线还原，并在报告里自断言 F1。
      #   两条本地各跑两遍均 rc=0（第 2 遍验「自清理有效、可重复」）。
      - name: Extended suites (搜索、券 L1/L2、用券、用户管理+仪表盘、RBAC、品牌 CRUD)
        working-directory: backend/loadtest
        run: |
          python day19-search-verify.py
          python day20-coupon-verify.py
          python day21-coupon-use-verify.py
          python day22-admin-verify.py
          python day23-rbac-verify.py
          python day24-brand-crud-verify.py

      # ================================================================================
      # Day 46 · 退款 / 售后 —— 全项目唯一会【退钱】的那条链路。
      #
      # ★ 为什么必须进 CI：它是五个写点的原子操作（refunds / orders / inventories /
      #   user_coupons / payments），任一处漏写都不会报错 —— 库存悄悄不回补、
      #   钱悄悄不退、券悄悄不退，而接口全都返回 200。
      #   这类「静默少写一个表」的 bug 只有对账式断言抓得住
      #   （库存逐格守恒 + 同单 SUM(payments.amount) == 0）。
      #
      # ★ 脚本自带两层控制组：
      #   ① 端到端：删掉 uk_refunds_active_order 后 [G] 段立刻红（并发不变式失守）；
      #   ② 单测：把「唯一冲突 → 400」的 catch 去掉后 2 条测试立刻红；
      #      ⇒ 概率性的并发路径由单测确定性地兜住，两层互补。
      #
      # ⚠️ cleanup 自带【自愈】：中途 abort 时，仍处于 PAID/SHIPPED/COMPLETED 的订单
      #    会先把货退回再删除 —— 否则 sold 那格永久漂移，会污染 day15 / day16 的守恒基线
      #    （Day 46 首跑实测踩过：sku4 sold 多 1 ⇒ 那两条各红一次）。
      # ================================================================================
      - name: Refund / aftersale (Day 46 —— 仅退款 + 退货退款 + 负向流水)
        working-directory: backend/loadtest
        run: |
          if ! python day46-refund-verify.py; then
            echo "::error::退款链路失败 —— 报告尾部："
            tail -60 day46-refund-verify-report.txt || true
            exit 1
          fi

      # ================================================================================
      # Day 44 · 身份域隔离 —— 「管理端 token 能顶替 C 端顾客」这条**静默越权**的回归闸门。
      #
      # ★ 为什么必须进 CI（而不是只在本机跑一次）：这个漏洞**不报错、不告警、不打日志** ——
      #   管理端 token 打 `/api/users/me` / `/api/orders` 拿到的是 HTTP 200 + 别人的
      #   手机号/昵称/邮箱/全部订单，任何「看退出码 / 看 5xx」的监控都发现不了。
      #   它横跨 `users` 与 `admins` 两张**各自从 1 起**的 id 空间（01-schema.sql），
      #   只要有人再写一次「principal 就是 sub」的代码，漏洞立刻原样回来。
      #
      # ★ 脚本自带控制组（本项目的硬要求）：同一套断言在【修复前】的代码上跑 → 10 条 FAIL，
      #   FAIL 详情里正是泄露出来的 `email` / `records` / 地址列表（见 docs/daily/Day-44）。
      #   ⇒ 断言对「有没有这道闸门」敏感，不是恒真的摆设。
      #
      # 只依赖 8080（demo / admin 两个种子账号由 initdb 提供），纯读、不写业务数据。
      # ================================================================================
      - name: Identity domain isolation (Day 44 —— 跨域 token 必须 403)
        working-directory: backend/loadtest
        run: |
          if ! python day44-identity-domain-verify.py; then
            echo "::error::身份域隔离失效 —— 报告尾部："
            cat day44-identity-domain-result.txt || true
            exit 1
          fi

      # V1.1 · D38-40：缓存验收（需要应用 + redis，都已在上面步骤就绪）。
      # day38 详情 cache-aside（含毒性注入对照组 + 停机降级）；
      # day39 tree/brands；day40 负缓存护栏（下架→NEG→上架翻转）。
      # ★ 判定输出只写 report 文件 ⇒ 失败必须 cat 出来（Perf 步骤同款教训）。
      - name: Cache verify (day38-40 —— 详情/树/品牌 cache-aside + 负缓存护栏)
        working-directory: backend/loadtest
        run: |
          for s in day38-redis-detail-verify day39-tree-brand-verify day40-redis-guard-verify; do
            echo "::group::$s"
            if ! python "$s.py"; then
              echo "::error::$s failed, report:"
              cat "$s-report.txt" || true
              exit 1
            fi
            echo "::endgroup::"
          done

      # ================================================================================
      # 前端全栈联调（Day 43）—— 两个 dev server 代理 + 一个后端，跨端链路 54 条断言。
      #
      # ★ 为什么现在才上（这是 FE4 那条注释承诺的触发条件）：FE4 时写的是
      #   「等前端出现过一次真实契约回归再上，别提前建」—— Day 43 本机联调正好抓到那一次：
      #   商品列表 VO 里根本没有 price（价格挂在 SKU 上），**编译期查不出来**；
      #   只有经由 dev proxy 打真实接口、再按前端自己的类型定义
      #   （frontend/*/src/types/api.d.ts）核对字段名，才会现形。
      #
      # ★ 为什么放 ci job 而不是单开 job：它复用的正是本 job 已经起好的后端 + 数据库 +
      #   M1 夹具数据。单开 job 等于把整套依赖再复制一遍（见下面 frontend job 的注释）。
      #   代价：本 job 多一次 setup-node + 两个 npm ci + 两个 dev server，约 +1.5–2 min。
      #
      # ★ 为什么每条断言都打 5173/5174 而不直连 8080：直连只能证明后端对；
      #   经由 dev server 代理才能同时覆盖「代理配置 + 接口契约 + 前端真正依赖的字段名」。
      #
      # ⚠️ 本地等价验证的边界（D43 实测，诚实标注）：
      #   ✓ 已在本地实跑：day43 脚本本身（54/54）；两个 dev server 起在 5173/5174；
      #     「轮询到 curl 返回 200」这套判定（用 PowerShell 等价跑，3s 内两个都 200）；
      #     两个 npm ci 退出码为 0（FE4 那一轮验过）。
      #   ✗ 本机**无法**等价跑这段 bash 胶水：Git Bash 里 npm 不可直接执行
      #     （node 目录下 npm 是无扩展名脚本 + .cmd 配对，`npm -v` 输出乱码 + null byte），
      #     而且 Bash 工具不能嵌套起 bash（`bash script` 直接 rc=1、零输出）。
      #   ⇒ 因此本步骤的**首次 CI 跑必须逐步核实**，不能因为绿灯就认为它在干活。
      #   （curl/sleep/while 是 ubuntu runner 标配；刻意不用 seq —— 本机 coreutils 缺它。）
      # ================================================================================
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/mall-app/package-lock.json
            frontend/admin-app/package-lock.json

      - name: Frontend e2e (Day 43 —— 两个 dev server 代理 + 跨端链路)
        run: |
          set -e
          for app in mall-app admin-app; do
            echo "::group::npm ci $app"
            (cd "frontend/$app" && npm ci --no-audit --no-fund)
            echo "::endgroup::"
          done

          # 两个 dev server 后台起（vite dev 只绑 localhost ⇒ 探测也用 localhost）
          (cd frontend/mall-app  && nohup npm run dev > /tmp/dev-mall.log  2>&1 &)
          (cd frontend/admin-app && nohup npm run dev > /tmp/dev-admin.log 2>&1 &)

          wait_dev() {   # $1=url $2=name $3=log
            i=0
            while [ $i -lt 60 ]; do
              i=$((i+1))
              code=$(curl -s -o /dev/null -w "%{http_code}" "$1" || true)
              if [ "$code" = "200" ]; then echo "$2 up after $((i*3))s"; return 0; fi
              sleep 3
            done
            echo "::error::$2 未在 180s 内就绪（vite 首请求要预构建依赖）"
            tail -40 "$3" || true
            return 1
          }
          wait_dev http://localhost:5173/ mall-app  /tmp/dev-mall.log
          wait_dev http://localhost:5174/ admin-app /tmp/dev-admin.log

          cd backend/loadtest
          if ! python day43-fe-full-stack-e2e.py; then
            echo "::error::Day 43 前端联调失败 —— 报告尾部："
            tail -70 day43-fe-full-stack-report.txt || true
            echo "::group::dev server 日志"
            tail -20 /tmp/dev-mall.log || true
            tail -20 /tmp/dev-admin.log || true
            echo "::endgroup::"
            exit 1
          fi

          # Day 47：退款/售后【跨端】链路。★ 复用上面这对 dev server（同一 step 内才活着）。
          #   它与 day46 的分工：day46 直连 8080 验「后端对不对」（82 条 + DB 对账）；
          #   本脚本走 5173/5174 代理，额外验「前端类型定义里声明的字段名对不对」——
          #   字段名写错在前端只会静默显示空白，不报错，直连后端永远验不出来。
          #   ★ 反向对照：op_product（商品管理员）全程 403（售后是订单域，见 18 号补丁第二节③）。
          if ! python day47-refund-fe-e2e.py; then
            echo "::error::Day 47 退款售后前端联调失败 —— 报告尾部："
            tail -70 day47-refund-fe-e2e-report.txt || true
            echo "::group::dev server 日志"
            tail -20 /tmp/dev-mall.log || true
            tail -20 /tmp/dev-admin.log || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Dump app log on failure
        if: failure()
        run: tail -100 /tmp/app.log || true

      # ================================================================================
      # 镜像构建 + 两条「本该失败却没失败」的防护（V1.4 · D42）
      #
      # 为什么放在 ci job 末尾而不是单开一个 job：jar 已经在上面的 mvn install 产出，
      # 这里直接复用同一个产物来构建镜像 —— 不重复编译，也保证镜像里装的正是刚才那一套验收过的字节。
      #
      # 三条断言都必须在 CI 里，因为它们守的都是**静默失败**：
      #   ① 少 `--launcher` ⇒ spring-boot-loader 层是空目录 ⇒ 镜像根本起不来，
      #      但 `docker build` 仍然**成功**（构建成功 ≠ 能跑）。
      #   ② prod profile 缺 DB_PASSWORD ⇒ 曾经**照样启动成功**（Spring 占位符懒解析），
      #      直到第一次查库才炸。现在由 ProdConfigGuard 在启动时拦住。
      #   ③ ★ 正向对照：没有它，② 的「失败」可能只是因为镜像本身是坏的 ——
      #      那样 ② 会通过而实际什么都没守住（本项目的老教训）。
      # 全部命令都已在本机等价跑过一遍，见 docs/daily/Day-42。
      # ================================================================================
      - name: Image build (layered) + prod config guard
        run: |
          docker build -f deploy/Dockerfile -t mallx-server:local .

          echo "::group::① 启动器类真的在镜像里（--launcher 陷阱）"
          docker run --rm --entrypoint sh mallx-server:local -c \
            'test -f org/springframework/boot/loader/launch/JarLauncher.class && test -d BOOT-INF/lib && echo "layers ok: JarLauncher + BOOT-INF/lib 都在"'
          echo "::endgroup::"

          echo "::group::② prod 缺 DB_PASSWORD 必须起不来"
          set +e
          timeout 90 docker run --rm \
            -e SPRING_PROFILES_ACTIVE=prod -e DB_HOST=nope -e DB_NAME=nope -e DB_USERNAME=nope \
            -e JWT_SECRET=abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKL \
            mallx-server:local > /tmp/guard.log 2>&1
          rc=$?
          set -e
          cat /tmp/guard.log | tail -12
          if [ "$rc" = "0" ] || [ "$rc" = "124" ]; then
            echo "::error::prod 缺 DB_PASSWORD 竟然起来了（rc=$rc，124=超时说明它一直在跑）—— 配置闸门失效"
            exit 1
          fi
          echo "guard ok: 缺 DB_PASSWORD -> rc=$rc（非零退出）"
          echo "::endgroup::"

          echo "::group::③ 正向对照：必填项给齐必须能起来"
          docker run -d --name guard-ok \
            -e SPRING_PROFILES_ACTIVE=prod -e DB_HOST=nope -e DB_NAME=nope -e DB_USERNAME=nope \
            -e DB_PASSWORD=nope -e JWT_SECRET=abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKL \
            mallx-server:local > /dev/null
          ok=no
          for i in $(seq 1 20); do
            sleep 3
            if docker logs guard-ok 2>&1 | grep -q "Started MallXApplication"; then ok=yes; break; fi
          done
          docker logs guard-ok 2>&1 | tail -5
          docker rm -f guard-ok > /dev/null
          if [ "$ok" != "yes" ]; then
            echo "::error::正向对照失败：配置给齐也起不来 ⇒ 上面第 ② 条的「通过」不可信"
            exit 1
          fi
          echo "control ok: 给齐配置 -> 正常启动（② 的失败确实是闸门拦的，不是镜像坏的）"
          echo "::endgroup::"

  # ==================================================================================
  # 前端构建门禁（FE4）。两个 Vue 3 + TS 应用各自独立构建，互不阻塞（fail-fast: false）。
  #
  # 判据只有两条，都来自退出码/文件系统，不看人类可读文本：
  #   ① `npm run build`（= vue-tsc -b && vite build）退出码为 0 —— 这一步同时覆盖
  #      **类型检查**：vue-tsc 是 build 的前半段，TS 报错会让整步失败。
  #   ② dist/index.html 真实存在 —— 防止「构建成功但没产物」这种假绿。
  #
  # ⚠️ 刻意不挂 dev server / E2E：前端 e2e（Playwright 之类）需要后端 + 数据库 + 种子数据，
  #    那等于把 ci job 整套依赖复制一遍；FE3 的 27 条断言是本机联调时跑的，先不搬到 runner。
  #    什么时候搬：等前端有过一次真实回归（改了接口契约而前端没跟上）之后再上，别提前建。
  # ==================================================================================
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mall-app, admin-app]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      # npm ci 而不是 npm install：锁文件是提交进仓库的，CI 必须装出和本地一模一样的那棵树
      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund

      # ★ Day 48：ESLint（--max-warnings 0 ⇒ warn 也算失败）。
      #   在此之前前端只有「类型 + 构建」两道关，代码干净是靠自觉，没有东西在 CI 里守着。
      #   ⚠️ 只在 mall-app 上配了（见下）—— admin-app 的规则集与测试尚未同步，先不装门禁。
      - name: Lint (ESLint, mall-app only)
        if: matrix.app == 'mall-app'
        run: npm run lint

      # ★ Day 48：Vitest 单测（15 条，覆盖 http 拦截器 / auth store / router 守卫
      #   —— 这三个是「改一处坏一片页面、而类型检查和构建都看不出来」的高危区）。
      - name: Unit tests (Vitest, mall-app only)
        if: matrix.app == 'mall-app'
        run: npm run test

      - name: Type check + Build (vue-tsc -b && vite build)
        run: npm run build

      - name: Assert build artifact exists
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html 不存在 —— 构建退出码为 0 但没有产物"
            ls -la dist 2>/dev/null || echo "(dist 目录都不存在)"
            exit 1
          fi
          echo "dist ok: $(du -sh dist | cut -f1)"
