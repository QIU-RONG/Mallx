# MallX Release —— 打 tag 就产出【可部署的镜像】，并可选地推到远端主机
#
# 设计要点（每一条都是为了让「线上跑的东西」可回答、可回滚）
# ------------------------------------------------------------------------------
#  1. ★★ 镜像里装的 jar 与 CI 里跑过 434 条回归的【是同一个文件】。
#     所以这里先 `mvn install`（含单元测试），再用同一个 jar 构建镜像 ——
#     绝不在镜像里重新编译一次。
#  2. ★★ 标签用 semver + sha，**不打 latest**。
#     latest 让「线上是哪一版」无法回答，也让回滚退化成「回滚到你正在修的坏版本」。
#  3. ★ 推镜像之后先做一次【容器级冒烟】再允许部署：
#     起一个容器，看 readiness 探针是否 UP。镜像能 build 不代表能跑
#     （jlink 漏模块就是典型的「构建成功、启动即炸」，D43 记过一次）。
#  4. 部署段默认【跳过】：没有配 secrets 时它是 no-op，不会因为没有服务器而变红。
#
# 需要的一次性配置
# ------------------------------------------------------------------------------
#  · 镜像仓库：GHCR 用内置的 GITHUB_TOKEN（本文件已声明 packages: write）
#  · 远端部署（可选）：仓库 Settings → Secrets 里加
#      DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH
#    其中 DEPLOY_PATH 指向服务器上 clone 好的仓库目录（里面要有 deploy/.env）
#
# 触发：git tag v1.4.0 && git push origin v1.4.0

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（不含 v 前缀）'
        required: true
        default: '0.0.0-manual'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ① 打 jar（★ 跑单元测试：它拦的是「单个方法对不对」，
      #    Python 端到端脚本拦的是「链路通不通」，两者不可替代）
      - name: Build jar + unit tests
        working-directory: backend/mallx
        run: mvn -B -ntp install

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mallx-server
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ③ 容器级冒烟：镜像【能跑】才算发布成功
      #    ★ 探针是 actuator readiness（DB 不可达 ⇒ DOWN），比 curl /api/hello 有意义。
      #    这里连一个空 Postgres 都不给 ⇒ 期望是「进程活着但 readiness DOWN」，
      #    而【进程活着】恰好能拦住 jlink 漏模块那类「一起来就 NoClassDefFoundError」。
      - name: Smoke test the image
        run: |
          set -e
          img="ghcr.io/${{ github.repository_owner }}/mallx-server:${{ steps.ver.outputs.version }}"
          docker run -d --name mallx-smoke --memory=384m \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_HOST=127.0.0.1 -e DB_NAME=nope -e DB_USERNAME=nope -e DB_PASSWORD=nope \
            -e JWT_SECRET="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
            "$img"
          for i in $(seq 1 20); do
            if docker logs mallx-smoke 2>&1 | grep -qE "Started MallXApplication|启动中止"; then
              break
            fi
            sleep 3
          done
          docker logs mallx-smoke 2>&1 | tail -40
          # ★ 判据：进程【还活着】= 配置闸门与运行时都正常；
          #   若 ProdConfigGuard 或 jlink 出问题，容器会立刻退出。
          if [ "$(docker inspect -f '{{.State.Running}}' mallx-smoke)" != "true" ]; then
            echo "::error::镜像起不来（不是配置闸门拦的，就是运行时缺东西）"
            docker rm -f mallx-smoke
            exit 1
          fi
          docker rm -f mallx-smoke
          echo "smoke ok"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    # ★ 没配 secrets 就整个跳过 —— 没有服务器不该让发布变红
    if: ${{ github.event_name == 'push' && secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Deploy over SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          VERSION="${GITHUB_REF_NAME#v}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd ${{ secrets.DEPLOY_PATH }}/deploy && IMAGE_TAG=$VERSION ./deploy.sh $VERSION"
